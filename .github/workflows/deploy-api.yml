name: Deploy API Lambda

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      # index.mjs が import しているモジュールも対象にする。
      # 2026-08-24: consent.mjs を追加したとき、ここが index.mjs だけだったため
      # consent.mjs だけを直しても deploy が走らない状態だった。
      - 'backend/*.mjs'
      - '.github/workflows/deploy-api.yml'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Run smoke tests
        run: npm test

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Handler is index.handler, so index.mjs must sit at the zip root.
      # -j strips the backend/ path. AWS SDK v3 is bundled in the nodejs runtime,
      # so no node_modules are packaged.
      #
      # ⚠️ index.mjs が import しているモジュールを必ず同梱する。
      # 2026-08-24: consent.mjs を追加したとき index.mjs だけを zip していたため、
      # デプロイすると Lambda が起動時の import で落ちる状態だった
      # （Cannot find module './consent.mjs'）。**API 全体が止まる。**
      # zip は成功し、CI も緑になるので、初回の呼び出しまで気づけない。
      # tests/deploy-package.test.mjs が、import と同梱の食い違いを検知する。
      - name: Package Lambda code
        run: |
          zip -j function.zip backend/index.mjs backend/consent.mjs
          echo "--- zip の中身 ---"
          unzip -l function.zip

      # Lambda functions live in ap-northeast-1 (2026-08-28 に us-east-1 から移設)。
      # The AWS_REGION secret is a
      # different region, so target the function region explicitly here
      # (a region mismatch causes AccessDenied against the ap-northeast-1 ARN).
      - name: Deploy to Lambda
        run: |
          aws lambda update-function-code \
            --function-name gutpacer-backend \
            --zip-file fileb://function.zip \
            --region ap-northeast-1

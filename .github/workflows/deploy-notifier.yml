name: Deploy Notifier Lambda (legacy index.mjs — MANUAL ONLY)

# WARNING: this workflow deploys the OLD implementation. It never runs
# automatically.
#
# What runs in production as `gutpacer-notifier` is
# `backend/notifier/index-mvp.mjs`, deployed by deploy-closed-beta.yml.
# This file deploys `backend/notifier/index.mjs`: the old implementation, which
# writes directly to `gutpacer-logs`.
#
# On 2026-08-27 this overwrote production with the old implementation twice.
#   First: paths was `backend/notifier/**`, so it fired on the PR for issue #3.
#   Second: paths was narrowed, but this file itself was still in paths, so the
#           very PR that fixed the trigger condition triggered it.
#
# Narrowing the trigger was not enough. The push trigger is removed and this
# runs by hand only. Use it when the old implementation is actually wanted, such
# as a rollback.

on:
  workflow_dispatch:
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Handler is index.handler, so index.mjs must sit at the zip root.
      # -j strips the backend/notifier/ path (previously the file was zipped
      # with its full path, which would not resolve at runtime).
      - name: Package Lambda code
        run: |
          zip -j function.zip backend/notifier/index.mjs

      # Lambda functions live in ap-northeast-1 (moved from us-east-1 on 2026-08-28).
      # The AWS_REGION secret is a
      # different region, so target the function region explicitly here
      # (a region mismatch causes AccessDenied against the ap-northeast-1 ARN).
      - name: Deploy to Lambda
        run: |
          aws lambda update-function-code \
            --function-name gutpacer-notifier \
            --zip-file fileb://function.zip \
            --region ap-northeast-1

name: Deploy Notifier Lambda (legacy index.mjs — MANUAL ONLY)

# ⚠️ **これは旧実装を出すワークフロー。自動では走らせない。**
#
# 本番の `gutpacer-notifier` で動いているのは `backend/notifier/index-mvp.mjs` で、
# それを出すのは **deploy-closed-beta.yml**。このファイルが出すのは
# `backend/notifier/index.mjs`（旧実装・`gutpacer-logs` を直書き）。
#
# **2026-08-27 に2回、本番をこの旧実装で上書きした。**
#   1回目: paths が `backend/notifier/**` で、issue #3 の PR に反応した
#   2回目: paths を絞ったが、**このファイル自身**も paths に入っていたため、
#          「起動条件を直す PR」そのもので起動した
#
# **起動条件を絞るだけでは足りなかった。** push トリガーを外し、
# 手動でしか走らないようにする。旧実装が要るとき（切り戻しなど）だけ使う。

on:
  workflow_dispatch:
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Handler is index.handler, so index.mjs must sit at the zip root.
      # -j strips the backend/notifier/ path (previously the file was zipped
      # with its full path, which would not resolve at runtime).
      - name: Package Lambda code
        run: |
          zip -j function.zip backend/notifier/index.mjs

      # Lambda functions live in us-east-1. The AWS_REGION secret is a
      # different region, so target the function region explicitly here
      # (a region mismatch causes AccessDenied against the us-east-1 ARN).
      - name: Deploy to Lambda
        run: |
          aws lambda update-function-code \
            --function-name gutpacer-notifier \
            --zip-file fileb://function.zip \
            --region us-east-1

name: Good first issue
description: Starter task for new contributors.
title: "[Good first] "
labels:
  - good first issue
  - help wanted
body:
  - type: markdown
    attributes:
      value: |
        Use this template for small changes that are safe and self-contained.
        Do not include personal data, credentials, or facility identifying info.
  - type: textarea
    id: summary
    attributes:
      label: Task summary
      description: What is the requested change and expected impact?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Acceptance criteria
      value: |
        - [ ] Reproducible and reviewable change
        - [ ] Minimal verification added or noted
        - [ ] Public-facing wording remains within existing policy
    validations:
      required: true
  - type: input
    id: effort
    attributes:
      label: Estimated effort
      placeholder: 30m
